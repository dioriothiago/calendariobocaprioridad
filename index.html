<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario Boca Prioridad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1a3f;--card:#112659;--ink:#f4f6fb;--mute:#9fb0d9;--line:#25397a;--gold:#f0a30a;--navy:#0a1a3f;
--placa:#22c55e;--reel:#ef4444;--redac:#a78bfa;--none:#6f7fa8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100%}
main{max-width:520px;margin:0 auto}
h1{font-size:28px;font-weight:800;margin:0 0 14px;letter-spacing:-.02em;color:var(--gold)}
.banner{background:var(--gold);color:var(--navy);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.banner b{font-size:17px}.banner ul{margin:6px 0 0;padding:0;list-style:none}
.banner li{display:flex;align-items:center;gap:8px;padding:2px 0}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bar h2{margin:0;font-size:20px;text-transform:capitalize}
button{font:inherit;cursor:pointer}
.nav{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px}
.day.out{visibility:hidden}
.day.today{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:800}
.day.tmr{outline:2px solid var(--gold)}
.day.sel{outline:3px solid #fff}
.dots{display:flex;gap:2px;height:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panel h3{margin:0 0 10px;font-size:18px;text-transform:capitalize}
.ev{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev input[type=checkbox]{width:24px;height:24px;margin:0;padding:0;accent-color:var(--gold);cursor:pointer}
.ev .body{min-width:0}
.ev .t{display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.ev small{color:var(--mute);display:block;margin-top:3px}
.ev.done .tt{text-decoration:line-through;opacity:.55}
.ev .x{background:none;border:0;color:var(--mute);font-size:18px}
.empty{color:var(--mute);margin:0 0 10px}
.add{display:grid;gap:8px;margin-top:12px}
.add .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;color-scheme:dark}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.area{background:transparent;border:2px solid var(--c);color:var(--c);border-radius:10px;padding:10px 4px;font-weight:600}
.area[aria-pressed=true]{background:var(--c);color:#fff}
.go{background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:12px;font-weight:800}
.go:disabled{opacity:.6}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:12px 0 0;font-size:14px}
.err{color:#ffb4a8;font-size:14px;margin:6px 0 0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Calendario Boca Prioridad</h1>
  <div id="banner"></div>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Mes anterior">‹</button>
    <h2 id="month"></h2>
    <button class="nav" id="next" aria-label="Mes siguiente">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <section class="panel">
    <h3 id="dayTitle"></h3>
    <div id="list"></div>
    <div class="add">
      <input id="title" placeholder="¿Qué se arma?" maxlength="80">
      <div class="areas" role="group" aria-label="Área">
        <button type="button" class="area" data-a="Placa" style="--c:var(--placa)">Placa</button>
        <button type="button" class="area" data-a="Reel" style="--c:var(--reel)">Reel</button>
        <button type="button" class="area" data-a="Redacción" style="--c:var(--redac)">Redacción</button>
      </div>
      <input id="time" type="time" aria-label="Hora (opcional)">
      <button class="go" id="save">Agregar al día</button>
      <p class="err" id="err" role="alert"></p>
    </div>
    <button class="link" id="notif">Activar aviso del día anterior</button>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = (k) => parse(k).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
const AREAS = ["Placa", "Reel", "Redacción"];
const COLORS = { "Placa": "var(--placa)", "Reel": "var(--reel)", "Redacción": "var(--redac)" };
const strip = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const canon = (a) => AREAS.find((x) => strip(x) === strip(a)) || "";
const colorOf = (e) => COLORS[e.area] || "var(--none)";

let events = [];
const today = new Date();
let cursor = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = key(today);
let area = canon(localStorage.getItem("area")) || "Placa";
const tomorrowKey = () => { const t = new Date(); t.setDate(t.getDate() + 1); return key(t); };

// Llama a la API y devuelve un error claro aunque el servidor responda algo que no es JSON.
async function api(method, body) {
  let r, txt;
  try {
    r = await fetch("/api/events", { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    txt = await r.text();
  } catch { throw new Error("sin conexión con el servidor"); }
  let j;
  try { j = JSON.parse(txt); } catch { throw new Error(`el servidor no respondió bien (código ${r.status})`); }
  if (!r.ok) throw new Error(j.error || `error ${r.status}`);
  return j;
}

async function load() {
  try {
    events = (await api("GET")).map((e) => ({ ...e, area: canon(e.area) }));
    $("err").textContent = "";
  } catch (e) { $("err").textContent = "No se pudieron cargar los eventos: " + e.message; }
  render();
  maybeNotify();
}

const byDay = (k) => events.filter((e) => e.date === k).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
const label = (e) => `${e.time ? e.time + " · " : ""}${e.title}`;

function render() {
  const t = byDay(tomorrowKey());
  const bn = $("banner");
  bn.innerHTML = "";
  if (t.length) {
    const box = document.createElement("div");
    box.className = "banner";
    box.innerHTML = `<b>Mañana ${t.length === 1 ? "hay 1 plan" : "hay " + t.length + " planes"}</b><ul></ul>`;
    t.forEach((e) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="dot" style="background:${colorOf(e)}"></span><span></span>`;
      li.lastChild.textContent = label(e) + (e.area ? ` (${e.area})` : "");
      box.querySelector("ul").appendChild(li);
    });
    bn.appendChild(box);
  }

  $("month").textContent = cursor.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
  const g = $("grid");
  g.innerHTML = ["L", "M", "M", "J", "V", "S", "D"].map((d) => `<div class="dow">${d}</div>`).join("");
  const offset = (cursor.getDay() + 6) % 7;
  const days = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
  for (let i = 0; i < offset; i++) g.insertAdjacentHTML("beforeend", `<div class="day out"></div>`);
  for (let d = 1; d <= days; d++) {
    const k = key(new Date(cursor.getFullYear(), cursor.getMonth(), d));
    const dots = byDay(k).slice(0, 3).map((e) => `<i style="background:${colorOf(e)}"></i>`).join("");
    const b = document.createElement("button");
    b.className = "day" + (k === key(today) ? " today" : "") + (k === tomorrowKey() ? " tmr" : "") + (k === selected ? " sel" : "");
    b.innerHTML = `${d}<span class="dots">${dots}</span>`;
    b.onclick = () => { selected = k; render(); };
    g.appendChild(b);
  }

  $("dayTitle").textContent = fmt(selected);
  const list = $("list");
  list.innerHTML = "";
  const evs = byDay(selected);
  if (!evs.length) list.innerHTML = `<p class="empty">Todavía no hay nada. Sumá el primer plan.</p>`;
  evs.forEach((e) => {
    const row = document.createElement("div");
    row.className = "ev" + (e.done ? " done" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!e.done; cb.setAttribute("aria-label", "Marcar como hecha");
    cb.onchange = async () => {
      const prev = !!e.done;
      e.done = cb.checked; render();
      try { await api("PATCH", { id: e.id, done: e.done }); $("err").textContent = ""; }
      catch (er) { e.done = prev; render(); $("err").textContent = "No se pudo actualizar: " + er.message; }
    };
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = `<div class="t"><span class="dot" style="background:${colorOf(e)}"></span><span class="tt"></span></div><small></small>`;
    body.querySelector(".tt").textContent = e.title;
    body.querySelector("small").textContent = [e.time, e.area || e.author].filter(Boolean).join(" · ");
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar evento");
    x.onclick = async () => {
      if (!confirm("¿Borrar este evento?")) return;
      try { await api("DELETE", { id: e.id }); } catch (er) { $("err").textContent = "No se pudo borrar: " + er.message; return; }
      load();
    };
    row.append(cb, body, x);
    list.appendChild(row);
  });

  document.querySelectorAll(".area").forEach((b) => b.setAttribute("aria-pressed", b.dataset.a === area));
  const n = $("notif");
  if (!("Notification" in window)) n.textContent = "Avisos no disponibles acá. En iPhone, agregá la página a la pantalla de inicio.";
  else if (Notification.permission === "granted") n.textContent = "Aviso del día anterior activado ✓";
  else if (Notification.permission === "denied") n.textContent = "Avisos bloqueados. Activalos en los ajustes del navegador.";
  else n.textContent = "Activar aviso del día anterior";
}

document.querySelectorAll(".area").forEach((b) => (b.onclick = () => { area = b.dataset.a; localStorage.setItem("area", area); render(); }));
$("prev").onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };
$("next").onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };

$("save").onclick = async () => {
  const title = $("title").value.trim();
  if (!title) { $("err").textContent = "Escribí qué se arma."; return; }
  $("save").disabled = true;
  try {
    await api("POST", { date: selected, title, time: $("time").value, area });
    $("title").value = ""; $("time").value = "";
    await load();
  } catch (e) { $("err").textContent = "No se pudo guardar: " + e.message; }
  $("save").disabled = false;
};

$("notif").onclick = async () => { if ("Notification" in window && Notification.permission === "default") { await Notification.requestPermission(); render(); maybeNotify(); } };

// Aviso: a partir de las 20:00, si mañana hay planes, avisa una vez por día (con la página abierta).
function maybeNotify() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if (new Date().getHours() < 20) return;
  const t = byDay(tomorrowKey());
  const flag = "notified-" + tomorrowKey();
  if (!t.length || localStorage.getItem(flag)) return;
  localStorage.setItem(flag, "1");
  new Notification("Mañana hay planes", { body: t.map((e) => label(e) + (e.area ? ` (${e.area})` : "")).join("\n") });
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
